<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>zenec</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='white'/><text x='50' y='72' font-size='65' font-family='monospace' font-weight='bold' text-anchor='middle' fill='black'>Z</text></svg>">
<style>
  .title-glitch {
    font-family: 'Space Mono', monospace;
    font-size: 42px;
    font-weight: 700;
    letter-spacing: 6px;
    color: #fff;
    margin-bottom: 40px;
    position: relative;
    text-shadow: 0 0 8px rgba(255,255,255,0.6);
    animation: glitchShake 4s infinite;
  }
  .title-glitch::before,
  .title-glitch::after {
    content: 'zenec';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  .title-glitch::before {
    animation: glitchTop 2.5s infinite;
    clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
  }
  .title-glitch::after {
    animation: glitchBot 2.5s infinite;
    clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
  }
  @keyframes glitchShake {
    0%, 92%, 100% { transform: translate(0); }
    93% { transform: translate(-2px, 1px); }
    94% { transform: translate(2px, -1px); }
    95% { transform: translate(0); }
  }
  @keyframes glitchTop {
    0%, 90%, 100% { transform: translate(0); filter: brightness(1); }
    91% { transform: translate(-2px, -1px); filter: brightness(1.5); text-shadow: -2px 0 #fff, 0 0 8px #fff; }
    92% { transform: translate(2px, 1px); filter: brightness(1.2); text-shadow: 2px 0 #fff, 0 0 8px #fff; }
    93% { transform: translate(0); filter: brightness(1); }
  }
  @keyframes glitchBot {
    0%, 93%, 100% { transform: translate(0); filter: brightness(1); }
    94% { transform: translate(2px, 1px); filter: brightness(1.5); text-shadow: 2px 0 #fff, 0 0 8px #fff; }
    95% { transform: translate(-2px, -1px); filter: brightness(1.2); text-shadow: -2px 0 #fff, 0 0 8px #fff; }
    96% { transform: translate(0); filter: brightness(1); }
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    color: #fff;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: url('./image1.png') no-repeat center center;
    background-size: cover;
    filter: brightness(0.7);
    z-index: 0;
    animation: bgPulse 5s ease-in-out infinite;
  }

  /* Vídeo de fundo (fica por cima do image1.png, que serve de reserva se o vídeo falhar) */
  .bg-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.7);
    z-index: 0;
    pointer-events: none;
    animation: bgPulse 5s ease-in-out infinite;
  }

  @keyframes bgPulse {
    0%, 100% { filter: brightness(0.7); }
    50% { filter: brightness(0.8); }
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(10,10,10,0.4) 0%, rgba(10,10,10,0.75) 100%);
    z-index: 1;
  }

  .glow-effects {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    overflow: hidden;
  }

  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.15;
    animation: floatGlow 6s ease-in-out infinite;
  }

  .glow-1 {
    width: 200px;
    height: 200px;
    background: #00ff9d;
    top: 30%;
    left: 10%;
    animation-delay: 0s;
  }

  .glow-2 {
    width: 250px;
    height: 250px;
    background: #0066ff;
    top: 50%;
    right: 5%;
    animation-delay: 2s;
  }

  .glow-3 {
    width: 150px;
    height: 150px;
    background: #b400ff;
    bottom: 20%;
    left: 30%;
    animation-delay: 4s;
  }

  @keyframes floatGlow {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(20px, -30px) scale(1.1); }
    66% { transform: translate(-15px, 15px) scale(0.9); }
  }

  .snowflake {
    position: fixed;
    top: -20px;
    color: rgba(255, 255, 255, 0.8);
    font-size: 12px;
    pointer-events: none;
    z-index: 3;
    animation: snowfall linear infinite;
    text-shadow: 0 0 5px rgba(255,255,255,0.8);
  }

  @keyframes snowfall {
    0% { transform: translateY(-20px) translateX(0) rotate(0deg) scale(1); opacity: 0; }
    5% { opacity: 1; }
    25% { transform: translateY(25vh) translateX(30px) rotate(90deg) scale(1.1); }
    50% { transform: translateY(50vh) translateX(-20px) rotate(180deg) scale(1); }
    75% { transform: translateY(75vh) translateX(25px) rotate(270deg) scale(0.9); opacity: 0.8; }
    100% { transform: translateY(105vh) translateX(-10px) rotate(360deg) scale(0.7); opacity: 0; }
  }

  .wrapper {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 40px 20px;
    max-width: 400px;
    width: 100%;
  }

  .spotify {
    margin-bottom: 40px;
    opacity: 0.8;
    transition: opacity 0.3s;
  }

  .spotify:hover { opacity: 1; }

  /* Player local (substitui o iframe do Spotify, mesma altura de 80px) */
  .player {
    width: 100%;
    height: 80px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 18px;
    background: #121212;
    border-radius: 12px;
    text-align: left;
  }

  .player-icon {
    flex: none;
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.06);
    border-radius: 8px;
    color: #fff;
    font-size: 18px;
  }

  .player-info {
    flex: 1;
    min-width: 0;
  }

  .player-title {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    letter-spacing: 2px;
    color: #fff;
    margin-bottom: 10px;
  }

  .player-bar {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
    overflow: hidden;
  }

  .player-progress {
    width: 0%;
    height: 100%;
    background: #fff;
    border-radius: 2px;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* Botões: vidro escuro, borda de luz giratória, brilho que segue o mouse e inclinação 3D */
  @property --angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }

  @keyframes borderSpin {
    to { --angle: 360deg; }
  }

  @keyframes linkIn {
    from { opacity: 0; transform: translateY(24px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes linkRipple {
    to { transform: translate(-50%, -50%) scale(30); opacity: 0; }
  }

  .link {
    --accent: 255, 255, 255;
    --rx: 0deg;
    --ry: 0deg;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 18px 0;
    text-decoration: none;
    color: #b5b5b5;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    box-shadow: 0 6px 24px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.07);
    transition: transform 0.2s ease-out, color 0.2s, border-color 0.25s, box-shadow 0.25s;
    cursor: pointer;
    width: 100%;
    font-family: inherit;
    animation: linkIn 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
  }

  .link:nth-child(1) { --accent: 102, 192, 244; animation-delay: 0.1s; }
  .link:nth-child(2) { --accent: 30, 215, 96; animation-delay: 0.2s; }
  .link:nth-child(3) { --accent: 225, 48, 108; animation-delay: 0.3s; }
  .link:nth-child(4) { --accent: 190, 190, 255; animation-delay: 0.4s; }

  /* reflexo de luz que atravessa o botão */
  .link::before {
    content: '';
    position: absolute;
    top: 0;
    left: -120%;
    width: 60%;
    height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.16), transparent);
    transform: skewX(-20deg);
    transition: left 0.6s ease;
    pointer-events: none;
  }

  /* borda de luz que gira ao redor do botão */
  .link::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 2px;
    background: conic-gradient(from var(--angle), transparent 0%, transparent 60%, rgba(var(--accent), 0.95) 82%, transparent 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
    opacity: 0;
    transition: opacity 0.3s;
    animation: borderSpin 2.5s linear infinite;
    pointer-events: none;
  }

  .link:hover::before {
    left: 140%;
  }

  .link:hover::after {
    opacity: 1;
  }

  .link:hover {
    color: #fff;
    transform: perspective(700px) translateY(-4px) scale(1.03) rotateX(var(--rx)) rotateY(var(--ry));
    border-color: rgba(var(--accent), 0.55);
    background:
      radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(var(--accent), 0.3), transparent 65%),
      linear-gradient(135deg, rgba(var(--accent), 0.14), rgba(var(--accent), 0.03));
    box-shadow: 0 12px 34px rgba(var(--accent), 0.28), 0 0 22px rgba(var(--accent), 0.22), inset 0 1px 0 rgba(255,255,255,0.12);
  }

  .link:active {
    transform: perspective(700px) translateY(0) scale(0.97);
  }

  /* ícones dentro de um círculo na cor de cada rede */
  .link i {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 15px;
    text-align: center;
    color: rgba(var(--accent), 0.95);
    background: rgba(var(--accent), 0.12);
    transition: transform 0.25s, background 0.25s, box-shadow 0.25s;
  }

  .link:hover i {
    transform: scale(1.15) rotate(-8deg);
    background: rgba(var(--accent), 0.25);
    box-shadow: 0 0 16px rgba(var(--accent), 0.6);
  }

  /* onda ao clicar */
  .link .ripple {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: rgba(var(--accent), 0.45);
    transform: translate(-50%, -50%) scale(0);
    animation: linkRipple 0.65s ease-out forwards;
    pointer-events: none;
  }

  @media (prefers-reduced-motion: reduce) {
    .link, .link::before, .link::after { animation: none; transition: none; }
  }

  .copy-feedback {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 255, 157, 0.15);
    border: 1px solid rgba(0, 255, 157, 0.4);
    color: #00ff9d;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    padding: 10px 20px;
    border-radius: 8px;
    letter-spacing: 1px;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 9999;
    pointer-events: none;
  }

  .copy-feedback.show {
    opacity: 1;
  }

  .onlyfans-msg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    z-index: 9999;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 20px;
  }

  .onlyfans-msg.show {
    display: flex;
  }

  .onlyfans-msg .face {
    font-size: 80px;
  }

  .onlyfans-msg .text {
    font-family: 'Space Mono', monospace;
    font-size: 18px;
    color: #ff4757;
    text-align: center;
    letter-spacing: 3px;
    animation: shake 0.5s;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
  }

  @media (max-width: 480px) {
    .title { font-size: 32px; letter-spacing: 4px; }
  }
</style>
</head>
<body>

<video class="bg-video" id="bgVideo" src="fundo.mp4" autoplay muted loop playsinline preload="auto"></video>

<div class="glow-effects">
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="glow glow-3"></div>
</div>

<div class="wrapper">
  <h1 class="title-glitch">zenec</h1>

  <div class="links">
    <a class="link" href="https://steamcommunity.com/id/alakiban/" target="_blank"><i class="fa-brands fa-steam"></i>Steam</a>
    <a class="link" href="https://open.spotify.com/user/31kcnovulikf4fcv5umkqtfclvy4" target="_blank"><i class="fa-brands fa-spotify"></i>Spotify</a>
    <a class="link" href="https://www.instagram.com/joao_lima.c" target="_blank"><i class="fa-brands fa-instagram"></i>Instagram</a>
    <a class="link" onclick="copyEpicNick()"><i class="fa-solid fa-gamepad"></i>Epic Games</a>
  </div>
</div>

<div class="copy-feedback" id="copyFeedback">nick copiado pae</div>

<audio id="bgMusic" preload="auto"></audio>

<script>
// Snow effect
(function() {
  const container = document.createElement('div');
  container.style.cssText = 'position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden;';
  document.body.appendChild(container);

  const flakes = ['❄','❅','❆','✦','•','·','∘'];

  function createFlake() {
    const f = document.createElement('div');
    f.className = 'snowflake';
    f.textContent = flakes[Math.floor(Math.random()*flakes.length)];
    f.style.left = Math.random()*100+'%';
    f.style.fontSize = (Math.random()*10+6)+'px';
    f.style.animationDuration = (Math.random()*4+4)+'s';
    f.style.animationDelay = (Math.random()*5)+'s';
    f.style.opacity = Math.random()*0.6+0.3;
    container.appendChild(f);
    setTimeout(()=>f.remove(), 20000);
  }

  for(let i=0;i<50;i++) setTimeout(createFlake, i*200);
  setInterval(createFlake, 200);
})();

function showOnlyFans() {
  const msg = document.getElementById('onlyfansMsg');
  if (msg) msg.classList.add('show');
}

const onlyFansMsgEl = document.getElementById('onlyfansMsg');
if (onlyFansMsgEl) {
  onlyFansMsgEl.addEventListener('click', () => {
    onlyFansMsgEl.classList.remove('show');
  });
}

function copyEpicNick() {
  const nick = 'ZENEC AMASSA BOT';
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(nick).then(() => {
      showCopyFeedback();
    }).catch(() => {
      const textarea = document.createElement('textarea');
      textarea.value = nick;
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      document.body.appendChild(textarea);
      textarea.select();
      try { document.execCommand('copy'); showCopyFeedback(); } catch(e) {}
      document.body.removeChild(textarea);
    });
  }
}

function showCopyFeedback() {
  const el = document.getElementById('copyFeedback');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}
</script>

<script>
// Música de fundo: começa do 0:00 no primeiro clique ou toque em qualquer lugar
(function() {
  const audio = document.getElementById('bgMusic');
  const progress = document.getElementById('playerProgress');
  const events = ['click', 'touchend', 'keydown'];
  // Lista de músicas (todas na mesma pasta do index.html).
  // Uma é sorteada toda vez que a página abre; ao terminar, sorteia outra.
  const playlist = ['main.mp3'];
  let currentTrack = Math.floor(Math.random() * playlist.length);
  audio.src = playlist[currentTrack];
  let started = false;

  function playNextRandom() {
    let next = Math.floor(Math.random() * playlist.length);
    if (playlist.length > 1) {
      while (next === currentTrack) {
        next = Math.floor(Math.random() * playlist.length);
      }
    }
    currentTrack = next;
    audio.src = playlist[currentTrack];
    audio.play().catch(function() {});
  }

  audio.addEventListener('ended', playNextRandom);

  function removeListeners() {
    events.forEach(function(ev) {
      document.removeEventListener(ev, startMusic, true);
    });
  }

  function startMusic() {
    const bgVideo = document.getElementById('bgVideo');
    if (bgVideo && bgVideo.paused) bgVideo.play().catch(function() {});
    if (started) return;
    audio.currentTime = 0;
    const p = audio.play();
    if (p && typeof p.then === 'function') {
      p.then(function() {
        started = true;
        removeListeners();
      }).catch(function() {
        // O navegador recusou; tenta de novo no próximo clique/toque
      });
    } else {
      started = true;
      removeListeners();
    }
  }

  events.forEach(function(ev) {
    document.addEventListener(ev, startMusic, true);
  });

  audio.addEventListener('error', function() {
    console.warn('Não foi possível carregar ' + playlist[currentTrack] + '. Confira se o arquivo está na mesma pasta do index.html e se o nome está exatamente igual ao da lista.');
  });

  audio.addEventListener('timeupdate', function() {
    if (progress && audio.duration) {
      progress.style.width = (audio.currentTime / audio.duration * 100) + '%';
    }
  });
})();
</script>

<script>
// Efeitos dos botões: brilho que segue o mouse, inclinação 3D e onda ao clicar
(function() {
  document.querySelectorAll('.link').forEach(function(el) {
    el.addEventListener('mousemove', function(e) {
      const r = el.getBoundingClientRect();
      const x = e.clientX - r.left;
      const y = e.clientY - r.top;
      el.style.setProperty('--mx', x + 'px');
      el.style.setProperty('--my', y + 'px');
      el.style.setProperty('--ry', ((x / r.width - 0.5) * 10) + 'deg');
      el.style.setProperty('--rx', ((0.5 - y / r.height) * 8) + 'deg');
    });
    el.addEventListener('mouseleave', function() {
      el.style.setProperty('--rx', '0deg');
      el.style.setProperty('--ry', '0deg');
    });
    el.addEventListener('click', function(e) {
      const r = el.getBoundingClientRect();
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      ripple.style.left = (e.clientX - r.left) + 'px';
      ripple.style.top = (e.clientY - r.top) + 'px';
      el.appendChild(ripple);
      setTimeout(function() { ripple.remove(); }, 700);
    });
  });
})();
</script>

</body>
</html>
