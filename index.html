<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>zenec</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='white'/><text x='50' y='72' font-size='65' font-family='monospace' font-weight='bold' text-anchor='middle' fill='black'>Z</text></svg>">
<style>
  .title-glitch {
    font-family: 'Space Mono', monospace;
    font-size: 42px;
    font-weight: 700;
    letter-spacing: 6px;
    color: #fff;
    margin-bottom: 40px;
    position: relative;
    text-shadow: 0 0 8px rgba(255,255,255,0.6);
    animation: glitchShake 4s infinite;
  }
  .title-glitch::before,
  .title-glitch::after {
    content: 'zenec';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  .title-glitch::before {
    animation: glitchTop 2.5s infinite;
    clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
  }
  .title-glitch::after {
    animation: glitchBot 2.5s infinite;
    clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
  }
  @keyframes glitchShake {
    0%, 92%, 100% { transform: translate(0); }
    93% { transform: translate(-2px, 1px); }
    94% { transform: translate(2px, -1px); }
    95% { transform: translate(0); }
  }
  @keyframes glitchTop {
    0%, 90%, 100% { transform: translate(0); filter: brightness(1); }
    91% { transform: translate(-2px, -1px); filter: brightness(1.5); text-shadow: -2px 0 #fff, 0 0 8px #fff; }
    92% { transform: translate(2px, 1px); filter: brightness(1.2); text-shadow: 2px 0 #fff, 0 0 8px #fff; }
    93% { transform: translate(0); filter: brightness(1); }
  }
  @keyframes glitchBot {
    0%, 93%, 100% { transform: translate(0); filter: brightness(1); }
    94% { transform: translate(2px, 1px); filter: brightness(1.5); text-shadow: 2px 0 #fff, 0 0 8px #fff; }
    95% { transform: translate(-2px, -1px); filter: brightness(1.2); text-shadow: -2px 0 #fff, 0 0 8px #fff; }
    96% { transform: translate(0); filter: brightness(1); }
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    color: #fff;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: url('./image1.png') no-repeat center center;
    background-size: cover;
    filter: brightness(0.7);
    z-index: 0;
    animation: bgPulse 5s ease-in-out infinite;
  }

  /* Vídeo de fundo (fica por cima do image1.png, que serve de reserva se o vídeo falhar) */
  .bg-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.7);
    z-index: 0;
    pointer-events: none;
    animation: bgPulse 5s ease-in-out infinite;
  }

  @keyframes bgPulse {
    0%, 100% { filter: brightness(0.7); }
    50% { filter: brightness(0.8); }
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(10,10,10,0.4) 0%, rgba(10,10,10,0.75) 100%);
    z-index: 1;
  }

  .glow-effects {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    overflow: hidden;
  }

  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.15;
    animation: floatGlow 6s ease-in-out infinite;
  }

  .glow-1 {
    width: 200px;
    height: 200px;
    background: #00ff9d;
    top: 30%;
    left: 10%;
    animation-delay: 0s;
  }

  .glow-2 {
    width: 250px;
    height: 250px;
    background: #0066ff;
    top: 50%;
    right: 5%;
    animation-delay: 2s;
  }

  .glow-3 {
    width: 150px;
    height: 150px;
    background: #b400ff;
    bottom: 20%;
    left: 30%;
    animation-delay: 4s;
  }

  @keyframes floatGlow {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(20px, -30px) scale(1.1); }
    66% { transform: translate(-15px, 15px) scale(0.9); }
  }

  .snowflake {
    position: fixed;
    top: -20px;
    color: rgba(255, 255, 255, 0.8);
    font-size: 12px;
    pointer-events: none;
    z-index: 3;
    animation: snowfall linear infinite;
    text-shadow: 0 0 5px rgba(255,255,255,0.8);
  }

  @keyframes snowfall {
    0% { transform: translateY(-20px) translateX(0) rotate(0deg) scale(1); opacity: 0; }
    5% { opacity: 1; }
    25% { transform: translateY(25vh) translateX(30px) rotate(90deg) scale(1.1); }
    50% { transform: translateY(50vh) translateX(-20px) rotate(180deg) scale(1); }
    75% { transform: translateY(75vh) translateX(25px) rotate(270deg) scale(0.9); opacity: 0.8; }
    100% { transform: translateY(105vh) translateX(-10px) rotate(360deg) scale(0.7); opacity: 0; }
  }

  .wrapper {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 40px 20px;
    max-width: 400px;
    width: 100%;
  }

  .spotify {
    margin-bottom: 40px;
    opacity: 0.8;
    transition: opacity 0.3s;
  }

  .spotify:hover { opacity: 1; }

  /* Player local (substitui o iframe do Spotify, mesma altura de 80px) */
  .player {
    width: 100%;
    height: 80px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 18px;
    background: #121212;
    border-radius: 12px;
    text-align: left;
  }

  .player-icon {
    flex: none;
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.06);
    border-radius: 8px;
    color: #fff;
    font-size: 18px;
  }

  .player-info {
    flex: 1;
    min-width: 0;
  }

  .player-title {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    letter-spacing: 2px;
    color: #fff;
    margin-bottom: 10px;
  }

  .player-bar {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
    overflow: hidden;
  }

  .player-progress {
    width: 0%;
    height: 100%;
    background: #fff;
    border-radius: 2px;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px 0;
    text-decoration: none;
    color: #888;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    border-radius: 12px;
    transition: all 0.2s;
    cursor: pointer;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
    width: 100%;
    font-family: inherit;
  }

  .link:first-child {
    border-top: 1px solid rgba(255,255,255,0.05);
  }

  .link:hover {
    color: #fff;
    background: rgba(255,255,255,0.03);
  }

  .link i {
    font-size: 16px;
    width: 20px;
    text-align: center;
  }

  .copy-feedback {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 255, 157, 0.15);
    border: 1px solid rgba(0, 255, 157, 0.4);
    color: #00ff9d;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    padding: 10px 20px;
    border-radius: 8px;
    letter-spacing: 1px;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 9999;
    pointer-events: none;
  }

  .copy-feedback.show {
    opacity: 1;
  }

  .onlyfans-msg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    z-index: 9999;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 20px;
  }

  .onlyfans-msg.show {
    display: flex;
  }

  .onlyfans-msg .face {
    font-size: 80px;
  }

  .onlyfans-msg .text {
    font-family: 'Space Mono', monospace;
    font-size: 18px;
    color: #ff4757;
    text-align: center;
    letter-spacing: 3px;
    animation: shake 0.5s;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
  }

  @media (max-width: 480px) {
    .title { font-size: 32px; letter-spacing: 4px; }
  }
</style>
</head>
<body>

<video class="bg-video" id="bgVideo" src="fundo.mp4" autoplay muted loop playsinline preload="auto"></video>

<div class="glow-effects">
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="glow glow-3"></div>
</div>

<div class="wrapper">
  <h1 class="title-glitch">zenec</h1>

  <div class="links">
    <a class="link" href="https://steamcommunity.com/id/alakiban/" target="_blank"><i class="fa-brands fa-steam"></i>Steam</a>
    <a class="link" href="https://open.spotify.com/user/31kcnovulikf4fcv5umkqtfclvy4" target="_blank"><i class="fa-brands fa-spotify"></i>Spotify</a>
    <a class="link" href="https://www.instagram.com/joao_lima.c" target="_blank"><i class="fa-brands fa-instagram"></i>Instagram</a>
    <a class="link" onclick="copyEpicNick()">Epic Games</a>
  </div>
</div>

<div class="copy-feedback" id="copyFeedback">nick copiado pae</div>

<audio id="bgMusic" src="main.mp3" preload="auto"></audio>

<script>
// Snow effect
(function() {
  const container = document.createElement('div');
  container.style.cssText = 'position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden;';
  document.body.appendChild(container);

  const flakes = ['❄','❅','❆','✦','•','·','∘'];

  function createFlake() {
    const f = document.createElement('div');
    f.className = 'snowflake';
    f.textContent = flakes[Math.floor(Math.random()*flakes.length)];
    f.style.left = Math.random()*100+'%';
    f.style.fontSize = (Math.random()*10+6)+'px';
    f.style.animationDuration = (Math.random()*4+4)+'s';
    f.style.animationDelay = (Math.random()*5)+'s';
    f.style.opacity = Math.random()*0.6+0.3;
    container.appendChild(f);
    setTimeout(()=>f.remove(), 20000);
  }

  for(let i=0;i<50;i++) setTimeout(createFlake, i*200);
  setInterval(createFlake, 200);
})();

function showOnlyFans() {
  const msg = document.getElementById('onlyfansMsg');
  if (msg) msg.classList.add('show');
}

const onlyFansMsgEl = document.getElementById('onlyfansMsg');
if (onlyFansMsgEl) {
  onlyFansMsgEl.addEventListener('click', () => {
    onlyFansMsgEl.classList.remove('show');
  });
}

function copyEpicNick() {
  const nick = 'ZENEC AMASSA BOT';
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(nick).then(() => {
      showCopyFeedback();
    }).catch(() => {
      const textarea = document.createElement('textarea');
      textarea.value = nick;
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      document.body.appendChild(textarea);
      textarea.select();
      try { document.execCommand('copy'); showCopyFeedback(); } catch(e) {}
      document.body.removeChild(textarea);
    });
  }
}

function showCopyFeedback() {
  const el = document.getElementById('copyFeedback');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}
</script>

<script>
// Música de fundo: começa do 0:00 no primeiro clique ou toque em qualquer lugar
(function() {
  const audio = document.getElementById('bgMusic');
  const progress = document.getElementById('playerProgress');
  const events = ['click', 'touchend', 'keydown'];
  let started = false;

  function removeListeners() {
    events.forEach(function(ev) {
      document.removeEventListener(ev, startMusic, true);
    });
  }

  function startMusic() {
    const bgVideo = document.getElementById('bgVideo');
    if (bgVideo && bgVideo.paused) bgVideo.play().catch(function() {});
    if (started) return;
    audio.currentTime = 0;
    const p = audio.play();
    if (p && typeof p.then === 'function') {
      p.then(function() {
        started = true;
        removeListeners();
      }).catch(function() {
        // O navegador recusou; tenta de novo no próximo clique/toque
      });
    } else {
      started = true;
      removeListeners();
    }
  }

  events.forEach(function(ev) {
    document.addEventListener(ev, startMusic, true);
  });

  audio.addEventListener('error', function() {
    console.warn('Não foi possível carregar main.mp3. Confira se o arquivo está na mesma pasta do index.html e se o nome está exatamente main.mp3.');
  });

  audio.addEventListener('timeupdate', function() {
    if (progress && audio.duration) {
      progress.style.width = (audio.currentTime / audio.duration * 100) + '%';
    }
  });
})();
</script>

</body>
